[project]
name = "apfs-compress"
dynamic = ["version"]
description = "APFS transparent compression of read-mostly trees (Unity editors, SDKs) through a verified copy"
readme = "README.md"
authors = [{ name = "Emin Deniz", email = "emindeniz99@gmail.com" }]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
apfs-compress = "apfs_compress:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# The version lives in one place, where release-please bumps it; a static version here would
# go into uv.lock and break `uv sync --locked` on every bump.
[tool.hatch.version]
path = "src/apfs_compress/__init__.py"

[tool.uv]
# Stack supply-chain rule: resolve nothing published in the last 7 days.
exclude-newer = "7 days"

[dependency-groups]
dev = ["ruff", "ty"]

[tool.ruff]
line-length = 110
target-version = "py39"
extend-exclude = ["research"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ty.environment]
python-version = "3.9"
# The tool runs on macOS only (st_flags, ditto, codesign); check it as such, also on a Linux runner.
python-platform = "darwin"

[tool.ty.src]
exclude = ["research"]
