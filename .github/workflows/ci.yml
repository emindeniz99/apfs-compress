name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: format, lint, types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: install uv
        run: python3 -m pip install --user uv==0.13.5 && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: sync
        run: uv sync --locked
      - name: format, lint, types
        run: |
          uv run ruff format --check
          uv run ruff check
          uv run ty check --error-on-warning

  tests:
    name: unit tests on APFS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: install uv
        run: python3 -m pip install --user uv==0.13.5 && echo "$(python3 -m site --user-base)/bin" >> "$GITHUB_PATH"
      - name: sync
        run: uv sync --locked
      - name: unit tests
        run: uv run python -m unittest discover -s tests -v

  zizmor:
    name: workflow audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: install uv
        run: python3 -m pip install --user uv==0.13.5 && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: zizmor
        run: uv tool run zizmor==1.32.0 --persona regular .github/workflows
